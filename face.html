<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>VK App</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.development.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.development.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.2/babel.min.js"></script>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useRef, useEffect } = React;

    const BG = "#f0f2f5";

    const globalStyles = `
      @keyframes heartPop {
        0%   { transform: scale(1); }
        25%  { transform: scale(1.5); }
        50%  { transform: scale(0.88); }
        75%  { transform: scale(1.25); }
        100% { transform: scale(1); }
      }
      @keyframes heartFloat {
        0%   { opacity: 1; transform: translateY(0) scale(1); }
        100% { opacity: 0; transform: translateY(-38px) scale(1.6); }
      }
      * { box-sizing: border-box; margin: 0; padding: 0; }
      body { background: ${BG}; }
      .heart-svg { transition: filter 0.3s ease; position: relative; z-index: 1; }
      .heart-svg.liked {
        filter: drop-shadow(0 0 6px rgba(220,50,100,0.55));
        animation: heartPop 0.5s cubic-bezier(.36,.07,.19,.97) both;
      }
      .float-emoji {
        position: absolute; font-size: 11px; pointer-events: none;
        z-index: 3; animation: heartFloat 0.6s ease-out forwards;
      }
    `;

    const VerifiedIcon = () => (
      <svg width="16" height="16" viewBox="0 0 24 24" fill="#5181b8">
        <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-2 15l-5-5 1.41-1.41L10 14.17l7.59-7.59L19 8l-9 9z"/>
      </svg>
    );

    const DotsIcon = () => (
      <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor">
        <circle cx="5" cy="12" r="2"/><circle cx="12" cy="12" r="2"/><circle cx="19" cy="12" r="2"/>
      </svg>
    );

    const PencilIcon = () => (
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#818c99" strokeWidth="2">
        <path d="M17 3a2.828 2.828 0 1 1 4 4L7.5 20.5 2 22l1.5-5.5L17 3z"/>
      </svg>
    );

    const ShareIcon = () => (
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#19191a" strokeWidth="1.8">
        <path d="M4 12v8a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-8"/>
        <polyline points="16 6 12 2 8 6"/>
        <line x1="12" y1="2" x2="12" y2="15"/>
      </svg>
    );

    const stories = [
      { name: "Maria", bg: "#000000", avatar: "https://i.pravatar.cc/150?img=5" },
      { name: "Roman", bg: "#000000", avatar: "https://i.pravatar.cc/150?img=8" },
      { name: "Elena", bg: "#000000", avatar: "https://i.pravatar.cc/150?img=20" },
    ];
    const PROFILE_PIC = "https://i.pravatar.cc/150?img=47";
    const HEADER_AVATAR = "https://i.pravatar.cc/150?img=47";
    const seenAvatars = [
      "https://i.pravatar.cc/32?img=12",
      "https://i.pravatar.cc/32?img=25",
      "https://i.pravatar.cc/32?img=33",
    ];
    const postImages = [
      "https://picsum.photos/seed/dance1/700/875",
      "https://picsum.photos/seed/dance2/700/875",
      "https://picsum.photos/seed/dance3/700/875",
      "https://picsum.photos/seed/dance4/700/875",
      "https://picsum.photos/seed/dance5/700/875",
      "https://picsum.photos/seed/dance6/700/875",
      "https://picsum.photos/seed/dance7/700/875",
    ];

    function TopBar() {
      return (
        <div style={{ display:"flex", alignItems:"center", justifyContent:"space-between", padding:"12px 16px 8px", background: BG }}>
          <div style={{ display:"flex", alignItems:"center", gap:10 }}>
            <div style={{ width:36, height:36, borderRadius:"50%", overflow:"hidden", flexShrink:0 }}>
              <img src={HEADER_AVATAR} alt="Profile" style={{ width:"100%", height:"100%", objectFit:"cover", display:"block" }} />
            </div>
            <h1 style={{ fontSize:22, fontWeight:700, letterSpacing:"-0.3px", margin:0 }}>Home</h1>
          </div>
          <div style={{ display:"flex", alignItems:"center", gap:14 }}>
            <button style={{ background:"#e8e8e8", border:"none", padding:"5px", borderRadius:"50%", cursor:"pointer", color:"#444", display:"flex", alignItems:"center" }}>
              <svg width={20} height={20} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.2" strokeLinecap="round" strokeLinejoin="round">
                <line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/>
              </svg>
            </button>
            <button style={{ background:"none", border:"none", padding:0, cursor:"pointer", color:"#b0b0b0", display:"flex", alignItems:"center" }}>
              <svg width={26} height={26} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.8" strokeLinecap="round" strokeLinejoin="round">
                <circle cx="11" cy="11" r="7"/><line x1="16.5" y1="16.5" x2="22" y2="22"/>
              </svg>
            </button>
          </div>
        </div>
      );
    }

    function TabBar({ active, onNavigate }) {
      const tabs = [["home","Home"],["messages","Messages"],["notification","Notification"]];
      return (
        <div style={{ display:"flex", borderBottom:"1px solid #d8dadf", background: BG }}>
          {tabs.map(([key, label]) => (
            <div key={key} onClick={() => onNavigate(key)}
              style={{ flex:1, textAlign:"center", padding:"10px 0 8px", fontSize:14,
                fontWeight: active===key ? 600 : 500, color: active===key ? "#e1306c" : "#888",
                cursor:"pointer", position:"relative", background: BG }}>
              {label}
              {active===key && (
                <div style={{ position:"absolute", bottom:-1, left:"50%", transform:"translateX(-50%)",
                  width:"60%", height:2, background:"#e1306c", borderRadius:"2px 2px 0 0" }} />
              )}
            </div>
          ))}
        </div>
      );
    }

    function StoriesRow() {
      const [openStory, setOpenStory] = useState(null);
      return (
        <>
          <div style={{ display:"flex", gap:14, padding:"10px 16px 14px", overflowX:"auto", scrollbarWidth:"none", background: BG }}>
            <div style={{ display:"flex", flexDirection:"column", alignItems:"center", gap:5, cursor:"pointer", flexShrink:0 }}>
              <div style={{ width:72, height:72, position:"relative", flexShrink:0 }}>
                <div style={{ width:72, height:72, borderRadius:"50%", background:"linear-gradient(160deg,#4a3a4a,#1a1a2a)" }} />
                <div style={{ position:"absolute", bottom:0, right:0, width:22, height:22, borderRadius:"50%",
                  background:"#e8e8e8", border:`2px solid ${BG}`, display:"flex", alignItems:"center", justifyContent:"center" }}>
                  <svg width={12} height={12} viewBox="0 0 24 24" fill="none" stroke="#444" strokeWidth="3" strokeLinecap="round">
                    <line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/>
                  </svg>
                </div>
              </div>
              <span style={{ fontSize:12, color:"#262626" }}>Story</span>
            </div>
            {stories.map((s) => (
              <div key={s.name} onClick={() => setOpenStory(s)}
                style={{ display:"flex", flexDirection:"column", alignItems:"center", gap:5, cursor:"pointer", flexShrink:0 }}>
                <div style={{ width:72, height:72, borderRadius:"50%", padding:1.5,
                  background:"linear-gradient(45deg,#f09433,#e6683c,#dc2743,#cc2366,#bc1888)" }}>
                  <div style={{ width:"100%", height:"100%", borderRadius:"50%", border:`1.5px solid ${BG}`, background: s.bg, overflow:"hidden" }}>
                    <img src={s.avatar} alt={s.name} style={{ width:"100%", height:"100%", objectFit:"cover", display:"block" }} />
                  </div>
                </div>
                <span style={{ fontSize:12, color:"#19191a" }}>{s.name}</span>
              </div>
            ))}
          </div>
          {openStory && (
            <div onClick={() => setOpenStory(null)}
              style={{ position:"fixed", inset:0, zIndex:100, background:"#fff" }}>
            </div>
          )}
        </>
      );
    }

    function ProgressBar({ onDone }) {
      const [width, setWidth] = useState(0);
      useEffect(() => {
        const start = performance.now();
        const duration = 500;
        const tick = (now) => {
          const pct = Math.min(((now - start) / duration) * 100, 100);
          setWidth(pct);
          if (pct < 100) requestAnimationFrame(tick);
          else setTimeout(onDone, 50);
        };
        requestAnimationFrame(tick);
      }, []);
      return (
        <div style={{ position:"fixed", top:0, left:0, right:0, height:3, zIndex:9999, background:"rgba(255,255,255,0.3)" }}>
          <div style={{ height:"100%", width:`${width}%`, background:"#fff", transition:"width 0.05s linear", boxShadow:"0 0 8px rgba(255,255,255,0.8)" }} />
        </div>
      );
    }

    function PostDetailPage({ onBack }) {
      const total = postImages.length;
      const [cur, setCur] = useState(0);
      const [liked, setLiked] = useState(false);
      const [burst, setBurst] = useState(false);
      const [showMenu, setShowMenu] = useState(false);
      const touchX = useRef(null);

      const onTouchStart = (e) => { touchX.current = e.touches[0].clientX; };
      const onTouchEnd = (e) => {
        if (touchX.current === null) return;
        const diff = touchX.current - e.changedTouches[0].clientX;
        if (Math.abs(diff) > 40) {
          if (diff > 0 && cur < total - 1) setCur(i => i + 1);
          else if (diff < 0 && cur > 0) setCur(i => i - 1);
        }
        touchX.current = null;
      };
      const onLike = () => { setLiked(p => !p); setBurst(true); setTimeout(() => setBurst(false), 600); };

      return (
        <div style={{ background: BG, minHeight:"100vh" }}>
          <div style={{ position:"sticky", top:0, zIndex:50, background: BG, borderBottom:"1px solid #d0d4da", display:"flex", alignItems:"center", gap:12, padding:"14px 16px" }}>
            <button onClick={onBack} style={{ background:"none", border:"none", cursor:"pointer", padding:4, display:"flex", alignItems:"center" }}>
              <svg width="22" height="22" viewBox="0 0 22 22" fill="none">
                <line x1="18" y1="11" x2="4" y2="11" stroke="#3d83f5" strokeWidth="2" strokeLinecap="round"/>
                <path d="M9.5 6L4 11L9.5 16" stroke="#3d83f5" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" fill="none"/>
              </svg>
            </button>
            <span style={{ fontSize:17, fontWeight:700, color:"#0f1117", letterSpacing:"-0.2px" }}>Певица Нюша / Nyusha</span>
          </div>

          <div style={{ display:"flex", alignItems:"center", padding:"14px 16px 10px", gap:10, background: BG }}>
            <div style={{ width:46, height:46, borderRadius:"50%", overflow:"hidden", border:"2px solid #5181b8", flexShrink:0 }}>
              <img src={PROFILE_PIC} alt="Nyusha" style={{ width:"100%", height:"100%", objectFit:"cover" }} />
            </div>
            <div style={{ flex:1, minWidth:0 }}>
              <div style={{ display:"flex", alignItems:"center", gap:5 }}>
                <span style={{ fontWeight:600, fontSize:15, color:"#19191a" }}>Певица Нюша / Nyusha</span>
                <VerifiedIcon />
              </div>
              <div style={{ fontSize:13, color:"#818c99", marginTop:1 }}>20 Mar at 3:21 pm</div>
            </div>
            <div style={{ position:"relative" }}>
              <button onClick={() => setShowMenu(!showMenu)}
                style={{ background:"none", border:"none", cursor:"pointer", color:"#818c99", padding:4, borderRadius:"50%", display:"flex", alignItems:"center" }}
                onMouseEnter={e => e.currentTarget.style.background="#d8dadf"}
                onMouseLeave={e => e.currentTarget.style.background="none"}>
                <DotsIcon />
              </button>
              {showMenu && (
                <div style={{ position:"absolute", right:0, top:"110%", background:"#fff", borderRadius:8, boxShadow:"0 4px 20px rgba(0,0,0,0.15)", minWidth:160, zIndex:10, overflow:"hidden" }}>
                  {["Copy link","Report","Hide post"].map(item => (
                    <button key={item} onClick={() => setShowMenu(false)}
                      style={{ display:"block", width:"100%", textAlign:"left", padding:"10px 16px", background:"none", border:"none", fontSize:14, color:"#19191a", cursor:"pointer" }}
                      onMouseEnter={e => e.currentTarget.style.background="#f5f5f5"}
                      onMouseLeave={e => e.currentTarget.style.background="none"}>
                      {item}
                    </button>
                  ))}
                </div>
              )}
            </div>
          </div>

          <div style={{ padding:"0 16px 12px", fontSize:15, color:"#19191a", lineHeight:1.5 }}>
            Ловим моменты🤍🖼️🟧✨
          </div>

          <div style={{ position:"relative", width:"100%", aspectRatio:"4/5", background:"#111", overflow:"hidden", userSelect:"none" }}
            onTouchStart={onTouchStart} onTouchEnd={onTouchEnd}>
            <img src={postImages[cur]} alt="" aria-hidden="true" draggable={false}
              style={{ position:"absolute", inset:0, width:"100%", height:"100%", objectFit:"cover", transform:"scale(1.15)", filter:"blur(22px) grayscale(100%) brightness(0.55)", pointerEvents:"none" }} />
            <div style={{ position:"absolute", inset:0, display:"flex", alignItems:"center", justifyContent:"center" }}>
              <img src={postImages[cur]} alt="Post" draggable={false}
                style={{ width:"72%", height:"100%", objectFit:"cover", display:"block", filter:"grayscale(100%)", pointerEvents:"none" }} />
            </div>
            <div style={{ position:"absolute", top:12, right:12, background:"rgba(0,0,0,0.55)", borderRadius:20, padding:"3px 10px", color:"#fff", fontSize:13, fontWeight:500, backdropFilter:"blur(4px)" }}>
              {cur+1}/{total}
            </div>
            <div style={{ position:"absolute", bottom:12, left:"50%", transform:"translateX(-50%)", display:"flex", gap:5 }}>
              {postImages.map((_,i) => (
                <div key={i} style={{ width:i===cur?18:6, height:6, borderRadius:3, background:i===cur?"#fff":"rgba(255,255,255,0.45)", transition:"all 0.25s ease" }} />
              ))}
            </div>
          </div>

          <div style={{ display:"flex", alignItems:"center", gap:8, padding:"12px 16px 8px" }}>
            <div style={{ display:"flex" }}>
              {seenAvatars.map((src,i) => (
                <img key={i} src={src} alt="" style={{ width:22, height:22, borderRadius:"50%", border:`2px solid ${BG}`, marginLeft:i===0?0:-7, objectFit:"cover" }} />
              ))}
            </div>
            <span style={{ fontSize:13, color:"#818c99" }}>
              Seen by <strong style={{ color:"#19191a", fontWeight:600 }}>princess_peace</strong> and more
            </span>
          </div>

          <div style={{ display:"flex", alignItems:"center", padding:"4px 16px 10px" }}>
            <div onClick={onLike} style={{ display:"flex", alignItems:"center", gap:5, cursor:"pointer", flexShrink:0, position:"relative" }}>
              {burst && liked && ["❤️","💕","✨"].map((emoji,i) => (
                <span key={i} className="float-emoji" style={{ left:`${8+i*10}px`, top:"0px", animationDelay:`${i*80}ms` }}>{emoji}</span>
              ))}
              <svg className={`heart-svg${liked?" liked":""}`} width="24" height="24" viewBox="0 0 24 24"
                fill={liked?"#e8365d":"none"} stroke={liked?"#e8365d":"#19191a"} strokeWidth="1.8">
                <path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/>
              </svg>
              <span style={{ fontSize:15, fontWeight:600, color: liked?"#e8365d":"#19191a", transition:"color 0.3s" }}>241K</span>
            </div>
            <div style={{ display:"flex", alignItems:"center", gap:5, cursor:"pointer", marginLeft:34 }}>
              <PencilIcon />
              <span style={{ fontSize:13, color:"#818c99" }}>Say so…</span>
            </div>
            <div style={{ flex:1 }} />
            <div style={{ display:"flex", alignItems:"center", gap:5, cursor:"pointer", flexShrink:0 }}>
              <ShareIcon />
              <span style={{ fontSize:15, fontWeight:500, color:"#19191a" }}>Share</span>
            </div>
          </div>

          <div style={{ padding:"0 16px 8px", fontSize:13, color:"#818c99" }}>
            Posted on <span style={{ color:"#3a76c4", cursor:"pointer" }}>Thum-klyc/LifeProTips</span>
          </div>
          <div style={{ padding:"2px 16px 18px", fontSize:15, color:"#19191a", lineHeight:1.5 }}>
            A short caption to add personality to your
          </div>

          <div style={{ borderTop:"1px solid #e8eaf0", padding:"12px 16px 4px" }}>
            <div style={{ display:"flex", gap:10, marginBottom:16 }}>
              <img src="https://i.pravatar.cc/150?img=11" alt="Islam Eryomin"
                style={{ width:38, height:38, borderRadius:"50%", objectFit:"cover", flexShrink:0 }} />
              <div style={{ flex:1 }}>
                <div style={{ display:"flex", alignItems:"center", gap:5, marginBottom:2 }}>
                  <span style={{ fontWeight:700, fontSize:14, color:"#19191a" }}>Islam Eryomin</span>
                  <span style={{ fontSize:14 }}>⚡</span>
                </div>
                <div style={{ fontSize:15, color:"#19191a", lineHeight:1.45 }}>Красотка! 🧡</div>
                <div style={{ display:"flex", alignItems:"center", justifyContent:"space-between", marginTop:4 }}>
                  <span style={{ fontSize:12, color:"#818c99" }}>today at 3:57 pm</span>
                  <div style={{ display:"flex", alignItems:"center", gap:4, color:"#818c99" }}>
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#818c99" strokeWidth="1.8">
                      <path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/>
                    </svg>
                    <span style={{ fontSize:13 }}>8</span>
                  </div>
                </div>
              </div>
            </div>

            <div style={{ display:"flex", gap:10, marginBottom:16 }}>
              <img src="https://i.pravatar.cc/150?img=5" alt="Anastasia Rossiniol"
                style={{ width:38, height:38, borderRadius:"50%", objectFit:"cover", flexShrink:0 }} />
              <div style={{ flex:1 }}>
                <div style={{ fontWeight:700, fontSize:14, color:"#19191a", marginBottom:2 }}>Anastasia Rossiniol</div>
                <div style={{ fontSize:15, color:"#19191a", lineHeight:1.45 }}>А к нам прилетели наши французские друзья и мы их угощали куличами 🧐</div>
                <div style={{ display:"flex", alignItems:"center", justifyContent:"space-between", marginTop:4 }}>
                  <span style={{ fontSize:12, color:"#818c99" }}>today at 3:58 pm</span>
                  <div style={{ display:"flex", alignItems:"center", gap:4 }}>
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#818c99" strokeWidth="1.8">
                      <path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/>
                    </svg>
                    <span style={{ fontSize:13, color:"#818c99" }}>7</span>
                  </div>
                </div>
                <div style={{ display:"flex", gap:8, marginTop:12 }}>
                  <img src="https://i.pravatar.cc/150?img=23" alt="Lyudmila"
                    style={{ width:32, height:32, borderRadius:"50%", objectFit:"cover", flexShrink:0 }} />
                  <div style={{ flex:1 }}>
                    <div style={{ fontWeight:700, fontSize:13, color:"#19191a", marginBottom:2 }}>Lyudmila Laguteeva</div>
                    <div style={{ fontSize:14, color:"#19191a", lineHeight:1.45 }}>
                      <span style={{ color:"#3a76c4" }}>Анастасия</span>, Вы и здесь со своими сказками?🤣🤣
                    </div>
                    <div style={{ display:"flex", alignItems:"center", justifyContent:"space-between", marginTop:4 }}>
                      <span style={{ fontSize:12, color:"#818c99" }}>today at 7:11 pm</span>
                      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#818c99" strokeWidth="1.8">
                        <path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/>
                      </svg>
                    </div>
                  </div>
                </div>
              </div>
            </div>
          </div>
        </div>
      );
    }

    function VKPostCard({ onNavigate }) {
      const total = postImages.length;
      const [cur, setCur] = useState(0);
      const [showMenu, setShowMenu] = useState(false);
      const [liked, setLiked] = useState(false);
      const [burst, setBurst] = useState(false);
      const touchX = useRef(null);

      const onTouchStart = (e) => { touchX.current = e.touches[0].clientX; };
      const onTouchEnd = (e) => {
        if (touchX.current === null) return;
        const diff = touchX.current - e.changedTouches[0].clientX;
        if (Math.abs(diff) > 40) {
          if (diff > 0 && cur < total - 1) setCur(i => i + 1);
          else if (diff < 0 && cur > 0) setCur(i => i - 1);
        }
        touchX.current = null;
      };
      const onLike = () => { setLiked(p => !p); setBurst(true); setTimeout(() => setBurst(false), 600); };

      return (
        <div style={{ background: BG, cursor:"pointer" }} onClick={(e) => { if (!e.defaultPrevented) onNavigate(); }}>
          <div style={{ display:"flex", alignItems:"center", padding:"14px 16px 10px", gap:10, background: BG }}>
            <div style={{ width:46, height:46, borderRadius:"50%", overflow:"hidden", border:"2px solid #5181b8", flexShrink:0 }}>
              <img src={PROFILE_PIC} alt="Nyusha" style={{ width:"100%", height:"100%", objectFit:"cover" }} />
            </div>
            <div style={{ flex:1, minWidth:0 }}>
              <div style={{ display:"flex", alignItems:"center", gap:5 }}>
                <span style={{ fontWeight:600, fontSize:15, color:"#19191a" }}>Певица Нюша / Nyusha</span>
                <VerifiedIcon />
              </div>
              <div style={{ fontSize:13, color:"#818c99", marginTop:1 }}>20 Mar at 3:21 pm</div>
            </div>
            <div style={{ position:"relative" }}>
              <button onClick={(e) => { e.stopPropagation(); setShowMenu(!showMenu); }}
                style={{ background:"none", border:"none", cursor:"pointer", color:"#818c99", padding:4, borderRadius:"50%", display:"flex", alignItems:"center" }}
                onMouseEnter={e => e.currentTarget.style.background="#d8dadf"}
                onMouseLeave={e => e.currentTarget.style.background="none"}>
                <DotsIcon />
              </button>
              {showMenu && (
                <div style={{ position:"absolute", right:0, top:"110%", background: BG, borderRadius:8,
                  boxShadow:"0 4px 20px rgba(0,0,0,0.15)", minWidth:160, zIndex:10, overflow:"hidden" }}>
                  {["Copy link","Report","Hide post"].map(item => (
                    <button key={item} onClick={(e) => { e.stopPropagation(); setShowMenu(false); }}
                      style={{ display:"block", width:"100%", textAlign:"left", padding:"10px 16px",
                        background:"none", border:"none", fontSize:14, color:"#19191a", cursor:"pointer" }}
                      onMouseEnter={e => e.currentTarget.style.background="#d8dadf"}
                      onMouseLeave={e => e.currentTarget.style.background="none"}>
                      {item}
                    </button>
                  ))}
                </div>
              )}
            </div>
          </div>

          <div style={{ padding:"0 16px 12px", fontSize:15, color:"#19191a", lineHeight:1.5, background: BG }}>
            Ловим моменты🤍🖼️🟧✨
          </div>

          <div style={{ position:"relative", width:"100%", aspectRatio:"4/5", background:"#111", overflow:"hidden", userSelect:"none" }}
            onTouchStart={onTouchStart} onTouchEnd={onTouchEnd}>
            <img src={postImages[cur]} alt="" aria-hidden="true" draggable={false}
              style={{ position:"absolute", inset:0, width:"100%", height:"100%", objectFit:"cover", transform:"scale(1.15)", filter:"blur(22px) grayscale(100%) brightness(0.55)", pointerEvents:"none" }} />
            <div style={{ position:"absolute", inset:0, display:"flex", alignItems:"center", justifyContent:"center" }}>
              <img src={postImages[cur]} alt="Post" draggable={false}
                style={{ width:"72%", height:"100%", objectFit:"cover", display:"block", filter:"grayscale(100%)", pointerEvents:"none" }} />
            </div>
            <div style={{ position:"absolute", top:12, right:12, background:"rgba(0,0,0,0.55)", borderRadius:20,
              padding:"3px 10px", color:"#f0f2f5", fontSize:13, fontWeight:500, backdropFilter:"blur(4px)" }}>
              {cur+1}/{total}
            </div>
            <div style={{ position:"absolute", bottom:12, left:"50%", transform:"translateX(-50%)", display:"flex", gap:5 }}>
              {postImages.map((_,i) => (
                <div key={i} style={{ width: i===cur?18:6, height:6, borderRadius:3,
                  background: i===cur ? "#fff" : "rgba(255,255,255,0.45)", transition:"all 0.25s ease" }} />
              ))}
            </div>
          </div>

          <div style={{ display:"flex", alignItems:"center", gap:8, padding:"12px 16px 8px", background: BG }}>
            <div style={{ display:"flex" }}>
              {seenAvatars.map((src,i) => (
                <img key={i} src={src} alt="" style={{ width:22, height:22, borderRadius:"50%",
                  border:`2px solid ${BG}`, marginLeft: i===0?0:-7, objectFit:"cover" }} />
              ))}
            </div>
            <span style={{ fontSize:13, color:"#818c99" }}>
              Seen by <strong style={{ color:"#19191a", fontWeight:600 }}>princess_peace</strong> and more
            </span>
          </div>

          <div style={{ display:"flex", alignItems:"center", padding:"4px 16px 10px", background: BG }}>
            <div onClick={(e) => { e.stopPropagation(); onLike(); }} style={{ display:"flex", alignItems:"center", gap:5, cursor:"pointer", flexShrink:0, position:"relative" }}>
              {burst && liked && ["❤️","💕","✨"].map((emoji,i) => (
                <span key={i} className="float-emoji" style={{ left:`${8+i*10}px`, top:"0px", animationDelay:`${i*80}ms` }}>{emoji}</span>
              ))}
              <svg className={`heart-svg${liked?" liked":""}`} width="24" height="24" viewBox="0 0 24 24"
                fill={liked?"#e8365d":"none"} stroke={liked?"#e8365d":"#19191a"} strokeWidth="1.8">
                <path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/>
              </svg>
              <span style={{ fontSize:15, fontWeight:600, color: liked?"#e8365d":"#19191a", transition:"color 0.3s" }}>241K</span>
            </div>
            <div style={{ display:"flex", alignItems:"center", gap:5, cursor:"pointer", marginLeft:34 }}>
              <PencilIcon />
              <span style={{ fontSize:13, color:"#818c99" }}>Say so…</span>
            </div>
            <div style={{ flex:1 }} />
            <div style={{ display:"flex", alignItems:"center", gap:5, cursor:"pointer", flexShrink:0 }}>
              <ShareIcon />
              <span style={{ fontSize:15, fontWeight:500, color:"#19191a" }}>Share</span>
            </div>
          </div>

          <div style={{ padding:"0 16px 8px", fontSize:13, color:"#818c99", background: BG }}>
            Posted on <span style={{ color:"#3a76c4", cursor:"pointer" }}>Thum-klyc/LifeProTips</span>
          </div>
          <div style={{ padding:"2px 16px 18px", fontSize:15, color:"#19191a", lineHeight:1.5, background: BG }}>
            A short caption to add personality to your
          </div>
        </div>
      );
    }

    function MessagesPage({ onBack }) {
      return (
        <div style={{ fontFamily:"-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif", background:"#fff", minHeight:"100vh", maxWidth:480, margin:"0 auto" }}>
          <div style={{ display:"flex", alignItems:"center", justifyContent:"space-between", padding:"14px 16px 10px", background:"#fff", borderBottom:"1px solid #f0f0f0" }}>
            <div style={{ display:"flex", alignItems:"center", gap:8 }}>
              <button onClick={onBack} style={{ background:"none", border:"none", cursor:"pointer", padding:0, display:"flex", alignItems:"center", color:"#888" }}>
                <svg width={22} height={22} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
                  <line x1="19" y1="12" x2="5" y2="12"/>
                  <polyline points="12 19 5 12 12 5"/>
                </svg>
              </button>
              <span style={{ fontSize:20, fontWeight:700, color:"#000" }}>Messages</span>
              <svg width={14} height={14} viewBox="0 0 24 24" fill="none" stroke="#888" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round" style={{ marginTop:2 }}>
                <polyline points="6 9 12 15 18 9"/>
              </svg>
            </div>
            <div style={{ display:"flex", alignItems:"center", gap:18 }}>
              <button style={{ background:"none", border:"none", cursor:"pointer", padding:0, color:"#888", display:"flex" }}>
                <svg width={22} height={22} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.8" strokeLinecap="round" strokeLinejoin="round">
                  <path d="M12 20h9"/><path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5z"/>
                </svg>
              </button>
              <button style={{ background:"none", border:"none", cursor:"pointer", padding:0, color:"#888", display:"flex" }}>
                <svg width={22} height={22} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.8" strokeLinecap="round" strokeLinejoin="round">
                  <circle cx="11" cy="11" r="7"/><line x1="16.5" y1="16.5" x2="22" y2="22"/>
                </svg>
              </button>
            </div>
          </div>

          <div style={{ display:"flex", alignItems:"center", gap:12, padding:"12px 16px", background:"#fff" }}>
            <div style={{ width:48, height:48, borderRadius:"50%", overflow:"hidden", flexShrink:0 }}>
              <img src="https://i.pravatar.cc/150?img=47" alt="Nyusha" style={{ width:"100%", height:"100%", objectFit:"cover" }} />
            </div>
            <div style={{ flex:1, minWidth:0 }}>
              <div style={{ display:"flex", alignItems:"center", gap:5 }}>
                <span style={{ fontWeight:700, fontSize:15, color:"#000" }}>Нюша / Nyusha</span>
                <svg width={14} height={14} viewBox="0 0 24 24" fill="#4a76a8"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-2 15l-5-5 1.41-1.41L10 14.17l7.59-7.59L19 8l-9 9z"/></svg>
              </div>
              <div style={{ fontSize:13, color:"#888", whiteSpace:"nowrap", overflow:"hidden", textOverflow:"ellipsis" }}>
                Hi, Qqtube! Here, you can chat, mak… <span style={{ color:"#bbb" }}>· 14m</span>
              </div>
            </div>
          </div>

          <div style={{ display:"flex", flexDirection:"column", alignItems:"center", padding:"36px 24px 32px", background:"#fff" }}>
            <div style={{ display:"flex", justifyContent:"center", marginBottom:20 }}>
              {["https://i.pravatar.cc/150?img=5","https://i.pravatar.cc/150?img=20","https://i.pravatar.cc/150?img=8"].map((src, i) => (
                <img key={i} src={src} alt="" style={{ width:68, height:68, borderRadius:"50%", objectFit:"cover", border:"3px solid #fff", marginLeft: i===0?0:-18, position:"relative", zIndex:3-i }} />
              ))}
            </div>
            <h2 style={{ fontSize:21, fontWeight:700, color:"#000", textAlign:"center", marginBottom:10 }}>See Who's Already Here</h2>
            <p style={{ fontSize:15, color:"#888", textAlign:"center", lineHeight:1.5, marginBottom:28, maxWidth:270 }}>
              Find out who in your contacts is already on the app
            </p>
            <button style={{ width:"58%", maxWidth:200, padding:"8px 0", borderRadius:12, background:"#f0f2f5", border:"none", fontSize:14, fontWeight:700, color:"#19191a", cursor:"pointer", marginBottom:16 }}>
              Link Contacts
            </button>
            <button style={{ background:"none", border:"none", fontSize:15, fontWeight:600, color:"#000", cursor:"pointer" }}>
              Find Friends
            </button>
          </div>
        </div>
      );
    }

    function EmptyPage({ icon, text, bg }) {
      return (
        <div style={{ display:"flex", flexDirection:"column", alignItems:"center", justifyContent:"center",
          minHeight:"80vh", gap:12, background: bg || BG }}>
          {icon}
          <p style={{ fontSize:15, fontWeight:500, color:"#bbb" }}>{text}</p>
        </div>
      );
    }

    function HomePage({ onNavigateToPost }) {
      useEffect(() => {
        const tag = document.createElement("style");
        tag.innerHTML = globalStyles;
        document.head.appendChild(tag);
        return () => document.head.removeChild(tag);
      }, []);
      return (
        <div style={{ background: BG }}>
          <StoriesRow />
          <VKPostCard onNavigate={onNavigateToPost} />
        </div>
      );
    }

    function App() {
      const [page, setPage] = useState("home");
      const [navigating, setNavigating] = useState(false);

      const handleNavigateToPost = () => {
        setNavigating(true);
      };

      return (
        <div style={{ fontFamily:"-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif", background: BG, color:"#000", maxWidth:480, margin:"0 auto", minHeight:"100vh" }}>
          {navigating && (
            <ProgressBar onDone={() => { setNavigating(false); setPage("post"); }} />
          )}
          {page === "messages" ? (
            <MessagesPage onBack={() => setPage("home")} />
          ) : page === "post" ? (
            <PostDetailPage onBack={() => setPage("home")} />
          ) : (
            <>
              <div style={{ position:"sticky", top:0, zIndex:50 }}>
                <TopBar />
                <TabBar active={page} onNavigate={setPage} />
              </div>
              {page === "home" && <HomePage onNavigateToPost={handleNavigateToPost} />}
              {page === "notification" && (
                <EmptyPage
                  text="No notifications yet"
                  icon={<svg width={48} height={48} viewBox="0 0 24 24" fill="none" stroke="#ccc" strokeWidth="1.5" strokeLinecap="round" strokeLinejoin="round"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/></svg>}
                />
              )}
            </>
          )}
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById("root"));
    root.render(<App />);
  </script>
</body>
</html>
