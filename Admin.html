<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Header Tabs</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.development.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.development.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.2/babel.min.js"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { margin: 0; padding: 0; }
    .hide-scroll::-webkit-scrollbar { display: none; }
  </style>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel">
    const { useState } = React;

    const tabs = [
      "Dashboard","Settings","Manage Features","Languages","Users",
      "Payments & Ads","Pro System","Design","Tools","Pages",
      "Reports","API Settings","System Status","Changelogs",
    ];

    const cards = [
      { label: "Total Users",  count: "227,120", color: "#5c6bc0", bg: "#e8eaf6", icon: "users" },
      { label: "Active Users", count: "184,340", color: "#2e7d32", bg: "#e8f5e9", icon: "users" },
      { label: "New Users",    count: "12,880",  color: "#c62828", bg: "#fce4ec", icon: "users" },
      { label: "Total Posts",  count: "440,245", color: "#0288d1", bg: "#e1f5fe", icon: "posts" },
    ];

    const chartData = [
      { label: "29.10", pageviews: 1150, visitors: 580 },
      { label: "30.10", pageviews: 630,  visitors: 340 },
      { label: "31.10", pageviews: 2380, visitors: 870 },
      { label: "01.11", pageviews: 1380, visitors: 330 },
    ];

    function CardIcon({ type, color }) {
      if (type === "posts") {
        return (
          <svg width="26" height="26" viewBox="0 0 24 24" fill="none">
            <path d="M3 17.25V21h3.75L17.81 9.94l-3.75-3.75L3 17.25zM20.71 7.04a1 1 0 0 0 0-1.41l-2.34-2.34a1 1 0 0 0-1.41 0l-1.83 1.83 3.75 3.75 1.83-1.83z" fill={color}/>
            <rect x="3" y="21" width="18" height="1.5" rx="0.75" fill={color}/>
          </svg>
        );
      }
      return (
        <svg width="26" height="26" viewBox="0 0 24 24" fill="none">
          <path d="M16 11c1.66 0 2.99-1.34 2.99-3S17.66 5 16 5c-1.66 0-3 1.34-3 3s1.34 3 3 3zm-8 0c1.66 0 2.99-1.34 2.99-3S9.66 5 8 5C6.34 5 5 6.34 5 8s1.34 3 3 3zm0 2c-2.33 0-7 1.17-7 3.5V19h14v-2.5c0-2.33-4.67-3.5-7-3.5zm8 0c-.29 0-.62.02-.97.05 1.16.84 1.97 1.97 1.97 3.45V19h6v-2.5c0-2.33-4.67-3.5-7-3.5z" fill={color}/>
        </svg>
      );
    }

    function VisitorsChart() {
      const W = 500, H = 200;
      const padL = 48, padR = 16, padT = 16, padB = 36;
      const maxVal = 2500;
      const innerW = W - padL - padR;
      const innerH = H - padT - padB;
      const xStep = innerW / (chartData.length - 1);
      const yScale = v => padT + innerH - (v / maxVal) * innerH;

      const pts = (key) => chartData.map((d, i) => [padL + i * xStep, yScale(d[key])]);
      const polyline = (key) => pts(key).map(([x, y]) => `${x},${y}`).join(" ");
      const areaPath = (key) => {
        const p = pts(key);
        const start = `M ${p[0][0]},${p[0][1]}`;
        const lines = p.slice(1).map(([x, y]) => `L ${x},${y}`).join(" ");
        const close = `L ${p[p.length-1][0]},${padT + innerH} L ${p[0][0]},${padT + innerH} Z`;
        return `${start} ${lines} ${close}`;
      };

      const yTicks = [0, 500, 1000, 1500, 2000, 2500];

      return (
        <div style={{ width: "100%", padding: "20px 16px 16px", boxSizing: "border-box" }}>
          <p style={{ margin: "0 0 16px 0", fontSize: 12, fontWeight: 700, color: "#111", letterSpacing: "0.06em", textTransform: "uppercase" }}>
            Unique Visitors and Pageviews
          </p>
          <div style={{ width: "100%" }}>
            <svg viewBox={`0 0 ${W} ${H}`} style={{ width: "100%", display: "block" }} preserveAspectRatio="xMidYMid meet">
              <defs>
                <linearGradient id="blueGrad" x1="0" y1="0" x2="0" y2="1">
                  <stop offset="0%" stopColor="#64b5f6" stopOpacity="0.35"/>
                  <stop offset="100%" stopColor="#64b5f6" stopOpacity="0.02"/>
                </linearGradient>
                <linearGradient id="pinkGrad" x1="0" y1="0" x2="0" y2="1">
                  <stop offset="0%" stopColor="#f48fb1" stopOpacity="0.18"/>
                  <stop offset="100%" stopColor="#f48fb1" stopOpacity="0.02"/>
                </linearGradient>
              </defs>

              {yTicks.map(v => {
                const y = yScale(v);
                return (
                  <g key={v}>
                    <line x1={padL} y1={y} x2={W - padR} y2={y} stroke="#efefef" strokeWidth="1"/>
                    <text x={padL - 6} y={y + 4} textAnchor="end" fontSize="10" fill="#aaa">
                      {v === 0 ? "0" : v >= 1000 ? `${v/1000}K` : v}
                    </text>
                  </g>
                );
              })}

              {chartData.map((d, i) => (
                <text key={i} x={padL + i * xStep} y={H - padB + 18} textAnchor="middle" fontSize="10" fill="#aaa">
                  {d.label}
                </text>
              ))}

              <path d={areaPath("pageviews")} fill="url(#blueGrad)" />
              <path d={areaPath("visitors")} fill="url(#pinkGrad)" />

              <polyline points={polyline("pageviews")} fill="none" stroke="#64b5f6" strokeWidth="2.5" strokeLinejoin="round" strokeLinecap="round"/>
              <polyline points={polyline("visitors")} fill="none" stroke="#f06292" strokeWidth="2.5" strokeLinejoin="round" strokeLinecap="round"/>

              {pts("pageviews").map(([x, y], i) => (
                <circle key={i} cx={x} cy={y} r="4" fill="#fff" stroke="#64b5f6" strokeWidth="2.5"/>
              ))}
              {pts("visitors").map(([x, y], i) => (
                <circle key={i} cx={x} cy={y} r="4" fill="#fff" stroke="#f06292" strokeWidth="2.5"/>
              ))}
            </svg>
          </div>

          <div style={{ display: "flex", flexDirection: "column", gap: 10, marginTop: 12, paddingLeft: 4 }}>
            {[
              { label: "Pageviews",       color: "#64b5f6" },
              { label: "Unique visitors", color: "#f06292" },
            ].map(({ label, color }) => (
              <div key={label} style={{ display: "flex", alignItems: "center", gap: 10 }}>
                <div style={{ width: 12, height: 12, borderRadius: "50%", backgroundColor: color, flexShrink: 0 }} />
                <span style={{ fontSize: 13, color: "#333" }}>{label}</span>
              </div>
            ))}
          </div>
        </div>
      );
    }

    function DashboardPage() {
      return (
        <div style={{ display: "flex", flexDirection: "column", width: "100%" }}>
          {/* Scrollable cards row */}
          <div
            className="hide-scroll"
            style={{
              display: "flex",
              overflowX: "auto",
              gap: 12,
              paddingLeft: 16,
              paddingRight: 16,
              scrollbarWidth: "none",
              msOverflowStyle: "none",
              WebkitOverflowScrolling: "touch",
            }}
          >
            {cards.map((card, i) => (
              <div key={i} style={{
                minWidth: 200,
                backgroundColor: "#ffffff",
                borderRadius: 16,
                border: "1px solid #ebebeb",
                padding: "20px 20px 24px",
                boxShadow: "0 1px 8px rgba(0,0,0,0.07)",
                flexShrink: 0,
              }}>
                <p style={{ margin: "0 0 18px 0", fontSize: 12, fontWeight: 700, color: "#111", letterSpacing: "0.06em", textTransform: "uppercase" }}>
                  {card.label}
                </p>
                <div style={{ display: "flex", alignItems: "center", gap: 14 }}>
                  <div style={{ width: 50, height: 50, borderRadius: "50%", backgroundColor: card.bg, display: "flex", alignItems: "center", justifyContent: "center", flexShrink: 0 }}>
                    <CardIcon type={card.icon} color={card.color} />
                  </div>
                  <span style={{ fontSize: 32, fontWeight: 700, color: "#111", letterSpacing: "-0.02em", lineHeight: 1 }}>
                    {card.count}
                  </span>
                </div>
              </div>
            ))}
          </div>

          {/* Ash gap divider */}
          <div style={{ height: 12, backgroundColor: "#f5f5f7", width: "100%", marginTop: 16 }} />

          {/* Full-width visitors/pageviews chart */}
          <VisitorsChart />
        </div>
      );
    }

    function EmptyPage() {
      return <div style={{ flex: 1, backgroundColor: "#ffffff", width: "100%", minHeight: "100%" }} />;
    }

    function HeaderTabs() {
      const [active, setActive] = useState(0);

      return (
        <div style={{
          display: "flex",
          flexDirection: "column",
          minHeight: "100vh",
          width: "100%",
          fontFamily: "'SF Pro Text', -apple-system, BlinkMacSystemFont, sans-serif",
          backgroundColor: "#f5f5f7",
        }}>

          {/* ── Sticky Tab Navbar ── */}
          <div style={{
            position: "sticky",
            top: 0,
            zIndex: 100,
            backgroundColor: "#ffffff",
            width: "100%",
            boxShadow: "0 1px 0 #e5e5e5",
          }}>
            <div
              className="hide-scroll"
              style={{
                display: "flex",
                overflowX: "auto",
                scrollbarWidth: "none",
                msOverflowStyle: "none",
                WebkitOverflowScrolling: "touch",
              }}
            >
              {tabs.map((tab, i) => (
                <button
                  key={tab}
                  onClick={() => setActive(i)}
                  style={{
                    position: "relative",
                    flexShrink: 0,
                    padding: "12px 18px 14px",
                    fontSize: 14,
                    fontWeight: active === i ? 600 : 500,
                    color: active === i ? "#000" : "#999",
                    background: "none",
                    border: "none",
                    cursor: "pointer",
                    letterSpacing: "-0.01em",
                    transition: "color 0.2s ease",
                    whiteSpace: "nowrap",
                    textAlign: "center",
                  }}
                >
                  {tab}
                  {active === i && (
                    <span style={{
                      position: "absolute", bottom: 0, left: 0, right: 0,
                      height: 2, backgroundColor: "#0071e3", borderRadius: 2, display: "block",
                    }} />
                  )}
                </button>
              ))}
            </div>
          </div>

          {/* Ash white gap below navbar */}
          <div style={{ height: 12, backgroundColor: "#f5f5f7", width: "100%", flexShrink: 0 }} />

          {/* Scrollable content area */}
          <div style={{
            backgroundColor: "#ffffff",
            width: "100%",
            flex: 1,
            padding: "16px 0",
            boxSizing: "border-box",
          }}>
            {active === 0 ? <DashboardPage /> : <EmptyPage />}
          </div>

        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById("root"));
    root.render(<HeaderTabs />);
  </script>
</body>
</html>
