<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Search Live</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.development.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.development.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.2/babel.min.js"></script>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    const tabs = ["All", "People", "Communities", "Posts"];

    const AVATARS = [
      "https://i.pravatar.cc/150?img=1",
      "https://i.pravatar.cc/150?img=2",
      "https://i.pravatar.cc/150?img=3",
      "https://i.pravatar.cc/150?img=4",
      "https://i.pravatar.cc/150?img=5",
      "https://i.pravatar.cc/150?img=6",
      "https://i.pravatar.cc/150?img=7",
      "https://i.pravatar.cc/150?img=8",
      "https://i.pravatar.cc/150?img=11",
      "https://i.pravatar.cc/150?img=12",
      "https://i.pravatar.cc/150?img=15",
      "https://i.pravatar.cc/150?img=17",
      "https://i.pravatar.cc/150?img=20",
      "https://i.pravatar.cc/150?img=33",
      "https://i.pravatar.cc/150?img=52",
      "https://i.pravatar.cc/150?img=57",
    ];

    function AddPersonIcon() {
      return (
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none">
          <path
            d="M20 8.5V13.5M17.5 11H22.5M8 15H16C18.2091 15 20 16.7909 20 19V21H4V19C4 16.7909 5.79086 15 8 15ZM16 7C16 9.20914 14.2091 11 12 11C9.79086 11 8 9.20914 8 7C8 4.79086 9.79086 3 12 3C14.2091 3 16 4.79086 16 7Z"
            stroke="#65676b"
            strokeWidth="1.5"
            strokeLinecap="round"
            strokeLinejoin="round"
          />
        </svg>
      );
    }

    function SearchLive() {
      const [activeTab, setActiveTab] = useState("All");
      const [query, setQuery] = useState("");
      const [results, setResults] = useState([]);
      const [loading, setLoading] = useState(false);
      const debounceRef = useRef(null);

      useEffect(() => {
        if (!query.trim()) {
          setResults([]);
          return;
        }
        clearTimeout(debounceRef.current);
        debounceRef.current = setTimeout(async () => {
          setLoading(true);
          try {
            const response = await fetch("https://api.anthropic.com/v1/messages", {
              method: "POST",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify({
                model: "claude-sonnet-4-20250514",
                max_tokens: 1000,
                messages: [
                  {
                    role: "user",
                    content: `Generate 4 realistic social network user profiles whose names match or relate to "${query}". 
Return ONLY a valid JSON array, no markdown, no explanation. Format:
[{"name":"Full Name","sub":"age and/or city e.g. 25 years old, Berlin"}]
Make names feel real and varied (different ages, cities). Some can be slight variations of the searched name.`,
                  },
                ],
              }),
            });
            const data = await response.json();
            const text = data.content?.[0]?.text || "[]";
            const clean = text.replace(/```json|```/g, "").trim();
            const parsed = JSON.parse(clean);
            const withAvatars = parsed.map((p, i) => ({
              ...p,
              id: i,
              avatar: AVATARS[i % AVATARS.length],
            }));
            setResults(withAvatars);
          } catch (e) {
            setResults([]);
          } finally {
            setLoading(false);
          }
        }, 400);
        return () => clearTimeout(debounceRef.current);
      }, [query]);

      return (
        <div style={{
          fontFamily: "'Segoe UI', -apple-system, BlinkMacSystemFont, sans-serif",
          maxWidth: 420, margin: "0 auto", minHeight: "100vh", backgroundColor: "#fff",
        }}>
          <div style={{ backgroundColor: "#fff", position: "sticky", top: 0, zIndex: 10 }}>
            <div style={{ display: "flex", alignItems: "center", padding: "12px 16px 10px" }}>
              <button style={{ background: "none", border: "none", cursor: "pointer", padding: "4px 8px 4px 0", display: "flex", alignItems: "center" }}>
                <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#050505" strokeWidth="2.2" strokeLinecap="round" strokeLinejoin="round">
                  <line x1="19" y1="12" x2="5" y2="12" />
                  <polyline points="12 19 5 12 12 5" />
                </svg>
              </button>
              <div style={{ flex: 1, display: "flex", alignItems: "center", justifyContent: "center" }}>
                <span style={{ fontWeight: 700, fontSize: 18, color: "#050505" }}>Search</span>
              </div>
              <button style={{ background: "none", border: "none", cursor: "pointer", padding: 0, display: "flex" }}>
                <div style={{ width: 38, height: 38, borderRadius: "50%", backgroundColor: "#f0f2f5", display: "flex", alignItems: "center", justifyContent: "center" }}>
                  <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#1c1e21" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
                    <line x1="4" y1="6" x2="20" y2="6" /><line x1="4" y1="12" x2="20" y2="12" /><line x1="4" y1="18" x2="20" y2="18" />
                    <circle cx="8" cy="6" r="2.2" fill="#f0f2f5" stroke="#1c1e21" strokeWidth="2" />
                    <circle cx="16" cy="12" r="2.2" fill="#f0f2f5" stroke="#1c1e21" strokeWidth="2" />
                    <circle cx="10" cy="18" r="2.2" fill="#f0f2f5" stroke="#1c1e21" strokeWidth="2" />
                  </svg>
                </div>
              </button>
            </div>
            <div style={{ padding: "0 16px 10px" }}>
              <div style={{ display: "flex", alignItems: "center", backgroundColor: "#f0f2f5", borderRadius: 50, padding: "8px 14px", gap: 8 }}>
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#65676b" strokeWidth="2.2" strokeLinecap="round" strokeLinejoin="round">
                  <circle cx="11" cy="11" r="7" /><line x1="16.5" y1="16.5" x2="22" y2="22" />
                </svg>
                <input value={query} onChange={(e) => setQuery(e.target.value)} placeholder="Search"
                  style={{ flex: 1, border: "none", background: "none", outline: "none", fontSize: 15, color: "#050505", fontFamily: "inherit" }} />
                {query.length > 0 && (
                  <button onClick={() => setQuery("")} style={{ background: "none", border: "none", cursor: "pointer", padding: 0, display: "flex", alignItems: "center" }}>
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#65676b" strokeWidth="2.2" strokeLinecap="round" strokeLinejoin="round">
                      <line x1="18" y1="6" x2="6" y2="18" /><line x1="6" y1="6" x2="18" y2="18" />
                    </svg>
                  </button>
                )}
              </div>
            </div>
            <div style={{ display: "flex", borderBottom: "1px solid #e4e6eb" }}>
              {tabs.map((tab) => (
                <button key={tab} onClick={() => setActiveTab(tab)} style={{
                  flex: 1, background: "none", border: "none", cursor: "pointer", padding: "12px 8px", fontSize: 14,
                  fontWeight: activeTab === tab ? 700 : 400,
                  color: activeTab === tab ? "#1877f2" : "#65676b",
                  borderBottom: activeTab === tab ? "2px solid #1877f2" : "2px solid transparent",
                  transition: "all 0.15s ease",
                }}>{tab}</button>
              ))}
            </div>
          </div>
          <div>
            {loading && <div style={{ padding: "24px 16px", textAlign: "center", color: "#65676b", fontSize: 14 }}>Searching...</div>}
            {!loading && query && results.length === 0 && (
              <div style={{ padding: "24px 16px", textAlign: "center", color: "#65676b", fontSize: 14 }}>No results for "{query}"</div>
            )}
            {!loading && results.map((p) => (
              <div key={p.id} style={{ display: "flex", alignItems: "center", padding: "10px 16px" }}>
                <img src={p.avatar} alt={p.name} style={{ width: 42, height: 42, borderRadius: "50%", objectFit: "cover", flexShrink: 0 }} />
                <div style={{ flex: 1, marginLeft: 12 }}>
                  <div style={{ fontWeight: 700, fontSize: 14, color: "#050505" }}>{p.name}</div>
                  <div style={{ fontSize: 12, color: "#65676b", marginTop: 2 }}>{p.sub}</div>
                </div>
                <button style={{ background: "none", border: "none", cursor: "pointer", padding: 6, display: "flex", alignItems: "center" }}>
                  <AddPersonIcon />
                </button>
              </div>
            ))}
            {!query && <div style={{ padding: "40px 16px", textAlign: "center", color: "#b0b3b8", fontSize: 14 }}>Type a name to search for people</div>}
          </div>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById("root"));
    root.render(<SearchLive />);
  </script>
</body>
</html>
