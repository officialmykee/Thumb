<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Calendar</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.development.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.development.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.2/babel.min.js"></script>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useRef, useEffect } = React;

    const MONTHS = [
      "January","February","March","April","May","June",
      "July","August","September","October","November","December"
    ];
    const MONTHS_SHORT = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
    const DAYS_SHORT = ["Sun","Mon","Tue","Wed","Thu","Fri","Sat"];
    const DAYS_LABEL = ["S","M","T","W","T","F","S"];

    function getDaysInMonth(year, month) {
      return new Date(year, month + 1, 0).getDate();
    }
    function getFirstDayOfMonth(year, month) {
      return new Date(year, month, 1).getDay();
    }

    const YEAR_RANGE = Array.from({ length: 30 }, (_, i) => 2010 + i);
    const BLUE = "#1A56DB";

    function ChevronDown() {
      return (
        <svg style={{ marginLeft: 3 }} width="10" height="6" viewBox="0 0 10 6">
          <path d="M1 1l4 4 4-4" stroke="#333" strokeWidth="1.5" strokeLinecap="round" fill="none"/>
        </svg>
      );
    }

    function Calendar() {
      const today = new Date();
      const [month, setMonth] = useState(today.getMonth());
      const [year, setYear] = useState(today.getFullYear());
      const [selected, setSelected] = useState(today.getDate());
      const [showYearPicker, setShowYearPicker] = useState(false);
      const [showMonthPicker, setShowMonthPicker] = useState(false);
      const yearRef = useRef(null);
      const monthRef = useRef(null);

      useEffect(() => {
        if (showYearPicker && yearRef.current) {
          const active = yearRef.current.querySelector("[data-active='true']");
          if (active) active.scrollIntoView({ block: "center" });
        }
      }, [showYearPicker]);

      useEffect(() => {
        if (showMonthPicker && monthRef.current) {
          const active = monthRef.current.querySelector("[data-active='true']");
          if (active) active.scrollIntoView({ block: "center" });
        }
      }, [showMonthPicker]);

      const daysInMonth = getDaysInMonth(year, month);
      const firstDay = getFirstDayOfMonth(year, month);

      const prevMonth = () => {
        if (month === 0) { setMonth(11); setYear(y => y - 1); }
        else setMonth(m => m - 1);
        setSelected(null);
      };
      const nextMonth = () => {
        if (month === 11) { setMonth(0); setYear(y => y + 1); }
        else setMonth(m => m + 1);
        setSelected(null);
      };

      const selectedDate = selected ? new Date(year, month, selected) : null;
      const dayOfWeek = selectedDate ? DAYS_SHORT[selectedDate.getDay()] : "";
      const monthShort = MONTHS_SHORT[month];

      const cells = [];
      for (let i = 0; i < firstDay; i++) cells.push(null);
      for (let d = 1; d <= daysInMonth; d++) cells.push(d);

      return (
        <div style={s.wrapper}>
          <div style={s.card}>
            {/* Blue header */}
            <div style={s.blueHeader}>
              <div style={s.headerYear}>{year}</div>
              <div style={s.headerDate}>
                {selected ? `${dayOfWeek}, ${monthShort} ${selected}` : "Select a date"}
              </div>
            </div>

            {/* Body */}
            <div style={s.body}>
              {/* Nav row */}
              <div style={s.nav}>
                <button style={s.navArrow} onClick={prevMonth}>
                  <svg width="9" height="15" viewBox="0 0 9 15" fill="none">
                    <path d="M8 1L1.5 7.5L8 14" stroke="#333" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"/>
                  </svg>
                </button>

                <div style={s.navCenter}>
                  {/* Month picker */}
                  <div style={s.pickerWrap}>
                    <button style={s.navTitle} onClick={() => { setShowMonthPicker(v => !v); setShowYearPicker(false); }}>
                      {MONTHS[month]}
                      <ChevronDown />
                    </button>
                    {showMonthPicker && (
                      <div style={s.dropdown} ref={monthRef}>
                        {MONTHS.map((m, i) => (
                          <button key={m} data-active={i === month}
                            style={{ ...s.dropItem, ...(i === month ? s.dropActive : {}) }}
                            onClick={() => { setMonth(i); setShowMonthPicker(false); setSelected(null); }}>
                            {m}
                          </button>
                        ))}
                      </div>
                    )}
                  </div>

                  {/* Year picker */}
                  <div style={s.pickerWrap}>
                    <button style={s.navTitle} onClick={() => { setShowYearPicker(v => !v); setShowMonthPicker(false); }}>
                      {year}
                      <ChevronDown />
                    </button>
                    {showYearPicker && (
                      <div style={s.dropdown} ref={yearRef}>
                        {YEAR_RANGE.map(y => (
                          <button key={y} data-active={y === year}
                            style={{ ...s.dropItem, ...(y === year ? s.dropActive : {}) }}
                            onClick={() => { setYear(y); setShowYearPicker(false); setSelected(null); }}>
                            {y}
                          </button>
                        ))}
                      </div>
                    )}
                  </div>
                </div>

                <button style={s.navArrow} onClick={nextMonth}>
                  <svg width="9" height="15" viewBox="0 0 9 15" fill="none">
                    <path d="M1 1l6.5 6.5L1 14" stroke="#333" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"/>
                  </svg>
                </button>
              </div>

              {/* Grid */}
              <div style={s.grid}>
                {DAYS_LABEL.map((d, i) => (
                  <div key={i} style={s.dayLabel}>{d}</div>
                ))}
                {cells.map((day, idx) => {
                  if (!day) return <div key={`e-${idx}`} />;
                  const isSel = selected === day;
                  return (
                    <button key={`d-${day}`} onClick={() => setSelected(day)} style={s.dayCell}>
                      <span style={{ ...s.dayNum, ...(isSel ? s.selNum : {}) }}>{day}</span>
                    </button>
                  );
                })}
              </div>

              {/* Footer */}
              <div style={s.footer}>
                <button style={s.footerBtn} onClick={() => setSelected(null)}>CLEAR</button>
                <div style={{ display: "flex", gap: 8 }}>
                  <button style={s.footerBtn} onClick={() => { setSelected(today.getDate()); setMonth(today.getMonth()); setYear(today.getFullYear()); }}>CANCEL</button>
                  <button style={s.footerBtn} onClick={() => alert(selected ? `Set: ${dayOfWeek}, ${monthShort} ${selected}, ${year}` : "No date selected")}>SET</button>
                </div>
              </div>
            </div>
          </div>

          {(showYearPicker || showMonthPicker) && (
            <div style={s.overlay} onClick={() => { setShowYearPicker(false); setShowMonthPicker(false); }} />
          )}
        </div>
      );
    }

    const s = {
      wrapper: {
        display: "flex", alignItems: "center", justifyContent: "center",
        minHeight: "100vh", background: "#e5e7eb",
        fontFamily: "'Roboto', -apple-system, BlinkMacSystemFont, sans-serif",
      },
      card: {
        background: "#fff", borderRadius: 4, width: 328,
        boxShadow: "0 8px 32px rgba(0,0,0,0.18)", overflow: "hidden",
        position: "relative", zIndex: 1,
      },
      blueHeader: {
        background: BLUE, padding: "20px 24px 20px",
      },
      headerYear: {
        color: "rgba(255,255,255,0.72)", fontSize: 14, fontWeight: 400,
        letterSpacing: "0.05em", marginBottom: 4,
      },
      headerDate: {
        color: "#fff", fontSize: 30, fontWeight: 400, letterSpacing: "-0.3px",
      },
      body: { padding: "12px 12px 4px" },
      nav: {
        display: "flex", alignItems: "center", justifyContent: "space-between",
        marginBottom: 6, padding: "0 2px",
      },
      navArrow: {
        background: "none", border: "none", cursor: "pointer",
        padding: "8px 10px", borderRadius: "50%",
        display: "flex", alignItems: "center", justifyContent: "center",
      },
      navCenter: { display: "flex", alignItems: "center", gap: 2 },
      navTitle: {
        background: "none", border: "none", cursor: "pointer",
        fontSize: 15, fontWeight: 500, color: "#111827",
        display: "flex", alignItems: "center", gap: 1,
        padding: "4px 6px", borderRadius: 4, fontFamily: "inherit",
      },
      pickerWrap: { position: "relative" },
      dropdown: {
        position: "absolute", top: "calc(100% + 4px)", left: "50%",
        transform: "translateX(-50%)", background: "#fff",
        border: "1px solid #e5e7eb", borderRadius: 8,
        boxShadow: "0 8px 32px rgba(0,0,0,0.13)", zIndex: 100,
        maxHeight: 200, overflowY: "auto", minWidth: 130, padding: "4px 0",
      },
      dropItem: {
        display: "block", width: "100%", textAlign: "center",
        background: "none", border: "none", cursor: "pointer",
        fontSize: 15, color: "#111827", padding: "9px 20px",
        fontFamily: "inherit", fontWeight: 400,
      },
      dropActive: { color: BLUE, fontWeight: 600, background: "#EFF6FF" },
      grid: {
        display: "grid", gridTemplateColumns: "repeat(7, 1fr)", rowGap: 0,
      },
      dayLabel: {
        textAlign: "center", fontSize: 13, fontWeight: 400,
        color: "#6b7280", paddingBottom: 8,
      },
      dayCell: {
        background: "none", border: "none", cursor: "pointer",
        display: "flex", alignItems: "center", justifyContent: "center",
        padding: "3px 0",
      },
      dayNum: {
        width: 36, height: 36, display: "flex", alignItems: "center",
        justifyContent: "center", borderRadius: "50%",
        fontSize: 14, fontWeight: 400, color: "#111827",
      },
      selNum: {
        background: BLUE, color: "#fff", fontWeight: 500,
      },
      footer: {
        display: "flex", justifyContent: "space-between", alignItems: "center",
        padding: "12px 8px 8px",
      },
      footerBtn: {
        background: "none", border: "none", cursor: "pointer",
        fontSize: 13, fontWeight: 600, color: BLUE,
        letterSpacing: "0.08em", padding: "10px 8px",
        borderRadius: 4, fontFamily: "inherit",
      },
      overlay: { position: "fixed", inset: 0, zIndex: 0 },
    };

    const root = ReactDOM.createRoot(document.getElementById("root"));
    root.render(<Calendar />);
  </script>
</body>
</html>
